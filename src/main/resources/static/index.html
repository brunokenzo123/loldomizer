<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOLdomizer - Menu Principal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 min-h-screen flex flex-col items-center justify-center font-sans text-white p-4">

<div class="bg-gray-800 p-8 rounded-xl shadow-2xl w-full max-w-xl border border-gray-700 text-center">
    <!-- Título com tom dourado -->
    <h1 class="text-4xl font-extrabold text-[#C79B3B] mb-2 tracking-wider">LOLdomizer</h1>
    <p class="text-gray-400 text-sm mb-8">Gerenciador de Desafios e Estatísticas de Partidas</p>

    <!-- Grade de opções do menu -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">

        <!-- Opção 1: Jogar / Sorteador -->
        <a href="/sorteio.html" class="flex flex-col items-center justify-center p-6 bg-gray-700/60 hover:bg-gray-700 border border-gray-600 hover:border-[#C79B3B] rounded-lg transition-all duration-200 group">
            <svg class="w-10 h-10 mb-3 text-[#C79B3B] group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <h2 class="text-lg font-bold text-gray-100">Iniciar Sorteio</h2>
            <p class="text-xs text-gray-400 mt-1">Gere campeão, rota e build aleatória</p>
        </a>

        <!-- Opção 2: Meu Histórico / Estatísticas -->
        <a href="/estatisticas.html" class="flex flex-col items-center justify-center p-6 bg-gray-700/60 hover:bg-gray-700 border border-gray-600 hover:border-[#C79B3B] rounded-lg transition-all duration-200 group">
            <svg class="w-10 h-10 mb-3 text-[#C79B3B] group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
            </svg>
            <h2 class="text-lg font-bold text-gray-100">Meu Histórico</h2>
            <p class="text-xs text-gray-400 mt-1">Confira vitórias, derrotas e taxas</p>
        </a>

    </div>

    <!-- Botão de Sair -->
    <button onclick="fazerLogout()" class="text-sm text-gray-400 hover:text-red-400 underline decoration-dotted transition-colors">
        Encerrar Sessão
    </button>
</div>

<script>
    function fazerLogout() {
        // Limpa os dados de navegação local e redireciona para a tela de login
        window.location.href = "/login.html";
    }
</script>
</body>
</html>
